data:
  raw_dir: datasets/raw
  processed_dir: datasets/processed    # ← Sortie du preprocessing
  split: train                          # ← NEW: train / val / test
  scale_factor: 4
  scale_factors: [2, 4, 8]             # ← NEW: all scales
  mask_type: surgical
  mask_types: [surgical, fabric, n95, black, white, colored]  # ← NEW
  image_size: 256

training:
  epochs: 100
  batch_size: 8
  lr_g: 0.0002
  lr_d: 0.0002
  lambda_l1: 100.0
  lambda_arcface: 1.0
  lambda_perceptual: 1.0

model:
  features_g: 64

logging:
  tensorboard_dir: results/tensorboard
  checkpoint_dir: models/checkpoints
  wandb_project: face-unmasking
